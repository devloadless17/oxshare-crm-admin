name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PLATFORM-CONVENTIONS R-7.6. `--no-audit` above keeps the install quiet;
      # auditing is a separate, FAILING step rather than install noise nobody
      # reads. This app holds admin session cookies and renders client PII.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: the audit found the backend's lint step green by
      # construction because ESLint had no config and exited early. A gate that
      # cannot fail is not a gate.
      - name: Lint
        run: npm run lint

      # --coverage so the thresholds in vitest.config.mts actually bind. They are
      # floors pinned to measured numbers, not aspirations, and may only go up.
      - name: Unit tests
        run: npm run test:coverage

      # This step does NOT detect API contract drift, and used to claim it did.
      #
      # `next build` type-checks this app against the COMMITTED
      # src/lib/api/types.gen.ts. If the backend changed a response shape and
      # nobody ran `npm run gen:api-types`, the committed file still describes the
      # old shape, the app still compiles against it, and this step is green — so
      # the one failure mode the generated types exist to catch is the one it
      # cannot see. It fires only in the harmless direction: someone regenerated
      # and forgot to update a caller.
      #
      # PLATFORM-CONVENTIONS §13.3 called that claim out as the most consequential
      # of three stale statements in the docs, "because it describes a safety net
      # that is not there". The claim is gone rather than left to reassure.
      #
      # The real check (R-1.3) needs the backend to publish its OpenAPI document
      # so this job can regenerate and diff. That is cross-repo work, tracked as a
      # Group C item in docs/AUDIT-oxshare-crm-admin.md. Until it exists, treat
      # `types.gen.ts` as a snapshot that a human must refresh.
      - name: Build
        run: npm run build

      # PLATFORM-CONVENTIONS R-1.3 — the real drift guard.
      #
      # This step existed and had never once run. The script exited 0 when the
      # backend was not checked out beside this repo, and nothing here ever
      # checked it out, so every push printed "skipping" and passed while the
      # rule index recorded contract drift as guarded. The comment also pointed
      # at a "nightly cross-repo job" — no scheduled workflow exists in any of
      # the three repos.
      #
      # The cost was concrete: POST /payments/withdrawals declares
      # Idempotency-Key required, the portal did not send it, and every client
      # withdrawal answered 400. Comparing the caller against the contract is
      # what turns that into a red build rather than a support ticket.
      #
      # So the contract is fetched here, and the script now FAILS rather than
      # skips when it is absent. Both halves are needed: either one alone brings
      # the silent pass back.
      - name: Fetch the backend contract
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-backend
          # Same owner, so the default token works while the repo is visible to
          # it. If that stops being true the step FAILS the build rather than
          # degrading to a skip — which is the behaviour this whole change is
          # about. Set CROSS_REPO_TOKEN to a read-only PAT if needed.
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .contract
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - name: API types match the backend contract
        env:
          OXSHARE_CONTRACT: ${{ github.workspace }}/.contract/openapi.json
        run: ./scripts/check-api-types.sh
