name: CI

# ── Minutes are a budget, so this runs when it can tell you something ────────
#
# Private-repo Actions minutes are finite and this suite is not cheap, so the
# triggers below are shaped to skip runs that could not fail:
#
#  - `paths-ignore` — a markdown-only commit cannot break a type-check. A docs
#    change once cost a full run for nothing, which is what prompted this.
#  - `pull_request` is scoped to PRs targeting `production`. Every push to `main`
#    already runs this workflow, so an unscoped trigger re-ran the SAME commits a
#    second time for the merge PR — paying twice for one answer.
#  - `workflow_dispatch` so a skipped or filtered commit can still be checked on
#    demand, without an empty commit to provoke it.
#
# To skip a run deliberately, put `[skip ci]` in the commit message — GitHub
# honours it natively. Ten exploratory pushes cost nothing; drop the tag on the
# one that matters. `workflow_dispatch` still works on a skipped commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:

# A superseded run tells you about a commit nobody is on any more. Cancelling it
# frees the minutes for the run that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PLATFORM-CONVENTIONS R-7.6. `--no-audit` above keeps the install quiet;
      # auditing is a separate, FAILING step rather than install noise nobody
      # reads. This app holds admin session cookies and renders client PII.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: the audit found the backend's lint step green by
      # construction because ESLint had no config and exited early. A gate that
      # cannot fail is not a gate.
      - name: Lint
        run: npm run lint

      # --coverage so the thresholds in vitest.config.mts actually bind. They are
      # floors pinned to measured numbers, not aspirations, and may only go up.
      # BEFORE the unit tests, deliberately. `src/test/sort-contract-census.test.ts`
      # reads this file to check every sort the console offers is one the API
      # accepts. It falls back to a DECLARED skip when the contract is absent, and
      # this step running after the tests meant CI always took that fallback — the
      # census was present, visible in the summary as skipped, and protecting
      # nothing in the one place a refused sort key would reach a user.
      - name: Fetch the backend contract
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-backend
          # Same owner, so the default token works while the repo is visible to
          # it. If that stops being true the step FAILS the build rather than
          # degrading to a skip — which is the behaviour this whole change is
          # about. Set CROSS_REPO_TOKEN to a read-only PAT if needed.
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .contract
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - name: Unit tests
        run: npm run test:coverage

      # This step does NOT detect API contract drift, and used to claim it did.
      #
      # `next build` type-checks this app against the COMMITTED
      # src/lib/api/types.gen.ts. If the backend changed a response shape and
      # nobody ran `npm run gen:api-types`, the committed file still describes the
      # old shape, the app still compiles against it, and this step is green — so
      # the one failure mode the generated types exist to catch is the one it
      # cannot see. It fires only in the harmless direction: someone regenerated
      # and forgot to update a caller.
      #
      # PLATFORM-CONVENTIONS §13.3 called that claim out as the most consequential
      # of three stale statements in the docs, "because it describes a safety net
      # that is not there". The claim is gone rather than left to reassure.
      #
      # The real check (R-1.3) needs the backend to publish its OpenAPI document
      # so this job can regenerate and diff. That is cross-repo work, tracked as a
      # Group C item in docs/AUDIT-oxshare-crm-admin.md. Until it exists, treat
      # `types.gen.ts` as a snapshot that a human must refresh.
      - name: Build
        run: npm run build
        env:
          # src/lib/env.ts resolves this AT IMPORT and throws in production so a
          # misconfigured build fails immediately rather than on the unlucky
          # first request. That is deliberate — but it also means a build with
          # no value cannot succeed at all, and CI never supplied one, so this
          # step failed on every push regardless of the change.
          #
          # A deployment supplies its own real URL. This value exists only to
          # satisfy the guard while compiling, and is never served.
          NEXT_PUBLIC_API_BASE_URL: https://ci-build-placeholder.invalid

      # Runs AFTER the build, because it reads that build's CSS output.
      #
      # Tailwind emits only the utilities it finds in the source, and globals.css
      # contributes everything hand-written — so the compiled bundle is the
      # complete set of classes that actually resolve, and a class used in the
      # source but absent from it resolves to nothing.
      #
      # Three screens shipped that way. /kyc/[userId] rendered "CountryUAE" and
      # "Last NameDoe" run together because `.info-row`, the flex row separating
      # a label from its value, matched no rule at all. Every other gate was
      # green throughout: a className is a string, so nothing type-checks it; an
      # unmatched CSS rule is not an error; and component tests assert on text
      # and roles, which is exactly what cannot see layout.
      - name: CSS classes resolve
        run: npm run check:css

      # PLATFORM-CONVENTIONS R-1.3 — the real drift guard.
      #
      # This step existed and had never once run. The script exited 0 when the
      # backend was not checked out beside this repo, and nothing here ever
      # checked it out, so every push printed "skipping" and passed while the
      # rule index recorded contract drift as guarded. The comment also pointed
      # at a "nightly cross-repo job" — no scheduled workflow exists in any of
      # the three repos.
      #
      # The cost was concrete: POST /payments/withdrawals declares
      # Idempotency-Key required, the portal did not send it, and every client
      # withdrawal answered 400. Comparing the caller against the contract is
      # what turns that into a red build rather than a support ticket.
      #
      # So the contract is fetched here, and the script now FAILS rather than
      # skips when it is absent. Both halves are needed: either one alone brings
      # the silent pass back.
      - name: API types match the backend contract
        env:
          OXSHARE_CONTRACT: ${{ github.workspace }}/.contract/openapi.json
        run: ./scripts/check-api-types.sh

  # ── The browser journeys, as EVIDENCE ─────────────────────────────────────
  #
  # `playwright.config.ts` deferred this: "Add the job once the specs have been
  # stable for a while." They have been, and the gap it left is not that the
  # journeys fail — it is that nothing proves they RAN.
  #
  # A skipped Playwright test reports as PASSING. Nineteen `test.skip()` guards
  # protect against conditions that are ordinary on a laptop — a rate limit, an
  # absent fixture — and the whole money journey sits behind two of them. So a
  # run that exercised none of it looks identical to one that exercised all of
  # it, which is the exact shape of evidence this suite exists to stop being
  # fooled by. `requirePrecondition` already answers that; `E2E_STRICT=1` is the
  # switch, and until now nothing had ever set it.
  #
  # ── WHY NOT ON EVERY PUSH ────────────────────────────────────────────────
  #
  # This job stands up Postgres, Redis, the API and a browser. That is minutes,
  # and the rest of this file is shaped around spending them only when they can
  # tell you something — the `pull_request` trigger above is already scoped to
  # `production` for exactly that reason.
  #
  # A production PR is the deploy gate, which is where evidence is worth paying
  # for; `workflow_dispatch` covers "I want to know now". Running this on every
  # push would multiply the cost and expose the load-sensitivity the unit suite
  # already shows — and a slow, intermittently red job is how a team learns to
  # ignore a red build, which costs more than it catches.
  #
  # No `continue-on-error`. The audit found a lint step that was green by
  # construction; a gate that cannot fail is not a gate.
  journeys:
    name: Browser journeys (E2E_STRICT)
    # Never on `push` — see above. Production PRs and on demand only.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oxshare
          POSTGRES_PASSWORD: oxshare_ci
          POSTGRES_DB: oxshare
        ports: ['5432:5432']
        # Without the health gate the API races the database's first accept()
        # and dies on boot, which reads as a failed test rather than as a
        # container that was not ready.
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      # Mail is part of these journeys, not a detail beside them: registration,
      # verification, invitation and password reset all continue through a
      # link that only exists in an inbox. Without this the specs that use one
      # fail on `waitForMail` — which reads as a broken app and is a missing
      # container.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "wget -q -O- http://localhost:8025/readyz || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The API is a sibling repo and this job cannot run without it. Same token
      # story as the contract step above, and the same rule: if it cannot be
      # fetched the build FAILS rather than degrading into a skip.
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-backend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .api

      # ONE step, so the API's environment is written once.
      #
      # GitHub Actions does not support YAML anchors, and a job-level `env`
      # cannot be used either: `PORT` would reach the admin's dev server, which
      # reads it — Next would try to start on the API's port and the journeys
      # would fail with a collision that looks like a broken app.
      - name: Start the API
        working-directory: .api
        # Seeds run on boot outside production and are idempotent, which is what
        # puts the e2e fixtures (e2e-admin@, e2e-restricted@, e2e-kyc-viewer@,
        # e2e-suspend@) in the database. Without them E2E_STRICT turns every
        # journey that needs one into a failure — correctly, but the cause would
        # be this step rather than the app.
        run: |
          # The API's lockfile needs npm 11, and this step installs the API's
          # dependencies — so it owes the same pin the backend's own CI carries.
          # npm 10 mishandles a lockfile whose package.json has `overrides`: it
          # re-resolves nested ranges against the registry's latest instead of
          # the locked version, so a release by any transitive dep starts
          # refusing the committed lockfile with "Missing: <pkg> from lock
          # file" and no commit involved. esbuild 0.28.2 is what tripped it
          # here, turning both frontends' E2E red at once with a message about
          # the API failing to start.
          npm install -g npm@11
          npm ci --no-audit --no-fund
          npm run build
          npm run db:migrate
          node dist/main &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in 60s"; exit 1
        env:
          DATABASE_URL: postgresql://oxshare:oxshare_ci@localhost:5432/oxshare
          REDIS_URL: redis://localhost:6379
          NODE_ENV: development
          PORT: '3001'
          API_PUBLIC_URL: http://localhost:3001
          ADMIN_URL: http://localhost:3000
          PORTAL_URL: http://localhost:3002
          # Ephemeral and CI-only. Real deployments supply their own; these
          # exist to satisfy the boot-time validation, which refuses to start on
          # a bad config rather than failing later on the unlucky request.
          ADMIN_JWT_SECRET: ci-admin-secret-ci-admin-secret-32
          ADMIN_JWT_REFRESH_SECRET: ci-admin-refresh-ci-admin-refresh
          JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secre
          APP_ENCRYPTION_KEY: ci-encryption-key-ci-encryption-k
          RIVAL_WEBHOOK_KEY: ci-rival-webhook-key
          # `disk`, STATED. env.validation refuses to infer a driver, and a run
          # that billed a live R2 account per push is one somebody disables.
          STORAGE_DRIVER: disk
          # No proxy in front of the API here, so the socket address IS the
          # caller — see common/security/client-ip.ts.
          TRUSTED_PROXY_HOPS: '0'
          # The commission engine refuses an aged backlog unless told what to do
          # with it. A fresh CI database has no history, so this only ever
          # applies to the seeds — and saying so beats the engine holding while
          # the journeys blame the screen.
          IB_ACCRUAL_START: all

      # SMTP is ADMIN-CONFIGURED, in the database — `env.validation.ts` says
      # "THERE ARE NO SMTP_* VARIABLES AT ALL", deliberately, so that a deploy
      # missing mail cannot start up quietly and swallow every message. The
      # consequence for CI is that a Mailpit container alone sends nothing:
      # somebody has to save the settings, exactly as an operator would on
      # Settings → Email. This is that, over the same endpoint.
      - name: Point SMTP at Mailpit
        run: |
          JAR=$(mktemp)
          curl -fsS -c "$JAR" -o /dev/null -X POST http://localhost:3001/v1/admin/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -d '{"email":"admin@oxshare.com","password":"admin123"}'
          # The anti-forgery token is a cookie here (same host), so it is read
          # from the jar rather than the echo header the browser path uses.
          CSRF=$(awk '$6 ~ /csrf/ {print $7}' "$JAR" | tail -1)
          test -n "$CSRF" || { echo "no CSRF cookie after admin login"; exit 1; }
          curl -fsS -b "$JAR" -o /dev/null -X PUT http://localhost:3001/v1/admin/settings/smtp \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -H "X-OxShare-CSRF: $CSRF" \
            -d '{"host":"localhost","port":1025,"username":null,"password":null,"fromAddress":"\"OxShare CI\" <no-reply@oxshare.test>","secure":false}'
          echo "SMTP points at Mailpit."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── The CLIENT PORTAL, because three admin journeys are CROSS-APP ────────
      #
      # `client-admin-actions` proves a suspension ends a live PORTAL session,
      # `realtime-console` proves a CLIENT's submission reaches the console, and
      # `auth-correctness` drives the portal's dead-session path. None of them can
      # run without the portal, and this job never started it — so all three
      # skipped in CI and reported as passing, for as long as the job has existed.
      #
      # They only became visible when the runtime skips were converted to declared
      # preconditions: the same tests then FAILED with "the portal is not running
      # at http://localhost:3000", which is the mechanism doing exactly its job.
      #
      # Started here rather than through Playwright's `webServer` deliberately: the
      # portal is a SIBLING REPO, and a config that reaches across repos works on a
      # developer's box and breaks in CI — which this workflow has already been bitten
      # by once, in the sort-contract census.
      - name: Check out the client portal
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-client
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .portal

      - name: Start the client portal
        working-directory: .portal
        # `build && start`, not `dev`: NEXT_PUBLIC_* is baked at COMPILE time, so a
        # dev server started without it would talk to the wrong API and the failure
        # would look like a broken portal rather than a mis-set variable.
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx next start --port 3000 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Portal up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "The portal did not become reachable on :3000 in 90s"; exit 1
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_REALTIME_ORIGIN: http://localhost:3003

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run e2e
        env:
          # THE POINT OF THIS JOB. A precondition that cannot be met now FAILS
          # and names itself, instead of skipping and reporting as passed.
          E2E_STRICT: '1'
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

      # Traces and screenshots are kept only for failures, so this stays small
      # and is the difference between a diagnosable red build and reproducing it.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
