name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: the audit found the backend's lint step green by
      # construction because ESLint had no config and exited early. A gate that
      # cannot fail is not a gate.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Catches the drift the generated API types are there to catch: if a
      # backend response shape changed and types.gen.ts was not regenerated,
      # this build fails.
      - name: Build
        run: npm run build
