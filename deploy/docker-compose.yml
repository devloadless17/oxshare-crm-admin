# The frontends server (`ssh oxshare-web`, Paris): Caddy + the admin console + the
# client portal. TWIN FILE: identical in oxshare-crm-admin and oxshare-crm-client
# (deploy/), because one server runs both apps and either repo's deploy ships it.
# Change both together. Releases go through release.sh (zero downtime, blue-green),
# one app at a time; the other app is never touched:
#
#   bash release.sh deploy admin <image>     bash release.sh rollback portal
#
# Only Caddy publishes host ports. Docker writes its own iptables rules and bypasses
# UFW, so any published port is open to the whole internet whatever `ufw status`
# says (DEPLOY-PLAYBOOK §2). The two apps listen only on this compose network.

name: oxshare-web

# Docker's json-file driver has no bound of its own. The server's daemon.json sets
# one too; this keeps the bound if the stack ever runs on a host without it.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

x-app: &app
  restart: unless-stopped
  # PID 1 that forwards SIGTERM, so a redeploy lets in-flight requests finish.
  init: true
  stop_grace_period: 20s
  <<: *logging

services:
  caddy:
    image: caddy:2
    container_name: oxshare_web_caddy
    restart: unless-stopped
    # HTTP/3 needs UDP/443. Delivery to THIS server was measured on 5 Oct 2026 (a
    # listener in a container received probes from outside Hostinger and from the
    # backend server). If the host ever stops passing it, remove the udp line AND
    # pin `servers { protocols h1 h2 }` in the Caddyfile together: h3 advertised over
    # a dead UDP path breaks some clients for the 30-day alt-svc cache lifetime.
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?PORTAL_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Which colour of each app is live; written by release.sh (it creates both
      # before Caddy first starts, or Docker would mount a directory instead).
      - ./active-admin.caddy:/etc/caddy/active-admin.caddy:ro
      - ./active-portal.caddy:/etc/caddy/active-portal.caddy:ro
      # caddy_data HOLDS THE CERTIFICATES AND THE ACME ACCOUNT KEY. Deleting it
      # forces re-issuance, and Let's Encrypt rate-limits that per domain per week.
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: Caddy must never wait for, or restart with, an app.
    <<: *logging

  # ── Each app as TWO services: zero-downtime releases (release.sh) ──────────
  #
  # A release starts the new version in the idle colour BESIDE the live one,
  # waits for its health check, switches Caddy (graceful reload), then stops the
  # old one. Which colour is live, and each colour's image, live in release.env.
  # Each service has its own profile, so a bare `docker compose up -d` starts
  # Caddy only: only release.sh starts an app.
  admin_blue:
    <<: *app
    image: ${ADMIN_BLUE:-oxshare-crm-admin:unreleased}
    container_name: oxshare_admin_blue
    profiles: [admin_blue]

  admin_green:
    <<: *app
    image: ${ADMIN_GREEN:-oxshare-crm-admin:unreleased}
    container_name: oxshare_admin_green
    profiles: [admin_green]

  portal_blue:
    <<: *app
    image: ${PORTAL_BLUE:-oxshare-crm-portal:unreleased}
    container_name: oxshare_portal_blue
    profiles: [portal_blue]

  portal_green:
    <<: *app
    image: ${PORTAL_GREEN:-oxshare-crm-portal:unreleased}
    container_name: oxshare_portal_green
    profiles: [portal_green]

volumes:
  caddy_data:
  caddy_config:
